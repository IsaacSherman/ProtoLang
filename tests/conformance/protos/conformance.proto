syntax = "proto3";

package protolang.conformance;

// Schema for the ProtoLang conformance vectors (spec 25.2).
//
// Every vector file shares this one schema so protoc runs once per language and the C++ link
// reuses a single conformance.pb object file. Each vector gets its OWN message: the C# backend
// names its extension class after the receiver, so two vector files extending the same message
// would emit duplicate class declarations into the one assembly the C# vectors are built as.

// well_known.protolang -- protobuf's own vocabulary as ordinary field types. Nothing names where
// these live: both protoc runs are expected to find them on their own.
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// integer_overflow.protolang -- wrapping arithmetic (spec 10.1).
message OverflowCase {
  int32 i32_left = 1;
  int32 i32_right = 2;
  int64 i64_left = 3;
  int64 i64_right = 4;
  uint32 u32_left = 5;
  uint32 u32_right = 6;
  uint64 u64_left = 7;
  uint64 u64_right = 8;
}

// integer_division.protolang -- truncation, on_zero, and the MIN / -1 pair (spec 10.2, 10.2.1).
message DivisionCase {
  int64 numerator = 1;
  int64 divisor = 2;
}

// floating_point.protolang -- IEEE 754 division, including by zero.
message FloatCase {
  double numerator = 1;
  double denominator = 2;
  float narrow_numerator = 3;
  float narrow_denominator = 4;
}

// casts.protolang -- explicit numeric conversions (spec 10.3).
message CastCase {
  int32 i32 = 1;
  int64 i64 = 2;
  uint32 u32 = 3;
  uint64 u64 = 4;
  double d = 5;
  float f = 6;

  // A NaN has no literal form, so vectors that need one build it as d / zero.
  double zero = 7;
}

// control_flow.protolang -- if / else if / else, while, break, continue, for-in (spec 15).
message ControlFlowCase {
  repeated int64 values = 1;
  int64 threshold = 2;
}

// strings.protolang -- string equality and string returns (spec 11).
message StringCase {
  string left = 1;
  string right = 2;
}

// enum_types.protolang -- enum types and named enum values.
//
// A top-level enum as well as a nested one, because the two are named differently in C++: protoc
// prefixes a nested enum's values with the flattened enum name and leaves a top-level enum's bare.
enum ConformanceStatus {
  CONFORMANCE_STATUS_UNSPECIFIED = 0;
  CONFORMANCE_STATUS_READY = 1;
}

message EnumCase {
  enum Level {
    LEVEL_UNSPECIFIED = 0;
    LEVEL_HIGH = 1;
    LEVEL_LOW = 2;
  }

  Level level = 1;
  Level other = 2;
  int64 count = 3;
  ConformanceStatus status = 4;
}

// whimsy_math.protolang -- mixed protobuf objects, numeric conversions, and compound control flow.
message WhimsyIngredient {
  int64 sparkle = 1;
  int32 fizz = 2;
  uint32 shimmer = 3;
  uint64 moon_dust = 4;
  double volatility = 5;
  float lift = 6;
  string name = 7;
  bool cursed = 8;
}

message WhimsyCauldronCase {
  repeated WhimsyIngredient ingredients = 1;
  int64 bias = 2;
  int64 divisor = 3;
  uint64 mask = 4;
  double drift = 5;
  float gust = 6;
  int32 gate = 7;
}

// well_known.protolang -- reading through message-typed fields that neither backend generates,
// because the protobuf runtime already carries them.
message WellKnownCase {
  google.protobuf.Timestamp starts_at = 1;
  google.protobuf.Duration length = 2;
  repeated google.protobuf.Timestamp checkpoints = 3;
  int64 nanos_per_second = 4;
}

// presence.protolang -- field presence and the guard rule (spec 8.4, 13.1).
//
// Deliberately mixes the three presence kinds a proto3 schema can have, because they are not the
// same question. A singular message field has presence without asking for it; a scalar declared
// 'optional' has explicit presence and generates a HasX; a plain scalar has none at all, and an
// unset one is indistinguishable from a set zero.
message PresenceCase {
  google.protobuf.Timestamp starts_at = 1;
  PresenceInner inner = 2;

  optional int64 tuning = 3;
  optional string label = 4;

  // No 'optional': an unset value and 0 are the same value here, which is what makes
  // 'has implicit_count' a compile error rather than a question with an answer.
  int64 implicit_count = 5;

  repeated int64 readings = 6;
}

message PresenceInner {
  google.protobuf.Timestamp stamp = 1;
  int64 weight = 2;
}

// checked/checked_arithmetic.protolang -- the checked overflow policy (spec 10.4).
message CheckedOverflowCase {
  int32 i32_left = 1;
  int32 i32_right = 2;
  int64 i64_left = 3;
  int64 i64_right = 4;
  uint32 u32_left = 5;
  uint32 u32_right = 6;
  uint64 u64_left = 7;
  uint64 u64_right = 8;
}

// saturating/saturating_arithmetic.protolang -- the saturating overflow policy (spec 10.4).
message SaturatingOverflowCase {
  int32 i32_left = 1;
  int32 i32_right = 2;
  int64 i64_left = 3;
  int64 i64_right = 4;
  uint32 u32_left = 5;
  uint32 u32_right = 6;
  uint64 u64_left = 7;
  uint64 u64_right = 8;
}
